# Lean plugin set for the demo replica.
#
# Trimmed from the original 290-plugin export to only what this bundle's
# jenkins.yaml (folders + custom tools) and items.yaml (folder / freeStyle /
# pipeline / multibranch stubs) actually require. The full export made the
# controller hang for minutes in plugin expansion (PluginListExpander.doExpand)
# and get killed by the liveness probe before it could finish booting.
#
# All entries are CAP plugins, so they resolve instantly from the envelope
# (no plugin catalog / update-center downloads) and the controller boots fast.
# The original full list is preserved in git history if fuller fidelity is
# needed later (restore plugins.yaml + catalog.yaml and bump the version).
plugins:
  - id: cloudbees-folder          # folder items (items.yaml)
  - id: configuration-as-code     # JCasC engine
  - id: workflow-aggregator       # pipeline suite: pipeline items + inline cps scripts
  - id: workflow-multibranch      # multibranch items
