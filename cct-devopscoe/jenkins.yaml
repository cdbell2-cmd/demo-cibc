tool:
  customTool:
    installations:
      - name: "Maven-3"
        properties:
          - installSource:
              installers:
                - zipExtractInstaller:
                    url: "https://mirror.csclub.uwaterloo.ca/apache/maven/maven-3/3.3.9/binaries/apache-maven-3.3.9-bin.tar.gz"
                    subdir: "apache-maven-3.3.9/bin"
      - name: "npm"
unclassified:
  abstractFolderConfiguration:
    healthMetrics:
      - worstChildHealthMetric:
          nonRecursive: false
      - averageChildHealthMetric
      - jobStatusHealthMetric:
          success: true
          failure: true
          unstable: true
          unbuilt: true
          countVirginJobs: false
      - projectEnabledHealthMetric
