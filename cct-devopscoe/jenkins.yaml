# JCasC for the CCT_DevOpsCOE controller replica.
# Reproduces: static JNLP agents, custom tools, folder health metrics.
# NOTE: Kubernetes pod templates are in jenkins.pod-templates.yaml
#       (review before merging - see README).
jenkins:
  systemMessage: "CCT_DevOpsCOE - demo replica generated from support bundle 014"
  numExecutors: 0
  nodes:
    - permanent:
        name: "aliimr-agent"
        labelString: ""
        remoteFS: "C:\\Jenkins"
        numExecutors: 1
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              internalDir: "remoting"
